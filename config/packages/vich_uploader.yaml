vich_uploader:
    db_driver: orm
    mappings:
        product_image:
            uri_prefix: /uploads/images
            upload_destination: '%kernel.project_dir%/public/uploads/images'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
        product_model:
            uri_prefix: /uploads/models
            upload_destination: '%kernel.project_dir%/public/uploads/models'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
