# Override para entorno de desarrollo local
# En prod usa solo compose.yaml: docker compose -f compose.yaml up -d
services:

  # En dev exponemos PostgreSQL en el puerto 5433 del host
  database:
    ports:
      - "5433:5432"

  # Mailpit para capturar emails en desarrollo
  mailer:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
