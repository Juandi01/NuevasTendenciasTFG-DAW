server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 64M;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 120;
        internal;
    }

    # Modelos 3D — MIME correcto, sin caché inmutable (nombres sin hash)
    location ~* \.(glb)$ {
        types { model/gltf-binary glb; }
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location ~* \.(gltf)$ {
        types { model/gltf+json gltf; }
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # Imágenes y fuentes — caché larga (AssetMapper añade hash al nombre)
    location ~* \.(ico|gif|png|jpg|jpeg|webp|svg|woff2?|ttf|eot)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # CSS y JS: sin caché en desarrollo para ver cambios inmediatamente
    location ~* \.(css|js)$ {
        try_files $uri /index.php$is_args$args;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
    }

    # Bloquear acceso directo a cualquier otro .php
    location ~ \.php$ {
        return 404;
    }

    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}
