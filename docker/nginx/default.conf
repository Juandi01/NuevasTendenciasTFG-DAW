server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 64M;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 120;
        internal;
    }

    # Imágenes, fuentes y modelos 3D — siempre ficheros físicos
    location ~* \.(ico|gif|png|jpg|jpeg|webp|svg|woff2?|ttf|eot|glb|gltf)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # CSS y JS: si existe como fichero (asset-map:compile) sírvelo directo;
    # si no, pásalo a PHP (AssetMapper dinámico en dev).
    location ~* \.(css|js)$ {
        try_files $uri /index.php$is_args$args;
    }

    # Deny access to .php files other than index.php
    location ~ \.php$ {
        return 404;
    }

    error_log /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}
