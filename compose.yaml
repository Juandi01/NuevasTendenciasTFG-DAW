services:

  # ── Nginx ────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public/css:/var/www/html/public/css:ro
      - ./public/bundles:/var/www/html/public/bundles:ro
      - ./public/models:/var/www/html/public/models:ro
      - uploads_data:/var/www/html/public/uploads:ro
      - assets_data:/var/www/html/public/assets:ro
    depends_on:
      php:
        condition: service_healthy
    restart: unless-stopped

  # ── PHP-FPM 8.4 ──────────────────────────────────────────────
  php:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-prod}
      APP_DEBUG: "0"
      APP_SECRET: ${APP_SECRET:-947f1577c5b616d2503253916d5a40d5}
      DATABASE_URL: "postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-!ChangeMe!}@database:5432/${POSTGRES_DB:-app}?serverVersion=16&charset=utf8"
      MAILER_DSN: ${MAILER_DSN:-null://null}
      MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN:-doctrine://default?auto_setup=0}
      AI_API_KEY: ${AI_API_KEY:-}
    volumes:
      - uploads_data:/var/www/html/public/uploads
      - assets_data:/var/www/html/public/assets
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ── PostgreSQL 16 ─────────────────────────────────────────────
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
    volumes:
      - database_data:/var/lib/postgresql/data:rw
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  database_data:
  uploads_data:
  assets_data:
